    <meta name="description" content="融资类产品日常测试专用的小工具，支持一键或自定义生成满足官方编码规则、高仿真可用于OCR识别的中国大陆企业营业执照、身份证、香港企业商业登记证、港澳居民来往内地通行证等测试材料，支持特定位置指定字符生成与随机编码生成。" />
    <meta property="og:title" content="测试材料生成器" />
    <meta property="og:description" content="融资类产品日常测试专用的小工具，支持一键或自定义生成满足官方编码规则、高仿真可用于OCR识别的中国大陆企业营业执照、身份证、香港企业商业登记证、港澳居民来往内地通行证等测试材料，支持特定位置指定字符生成与随机编码生成。" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return originalFetch;
              },
              set: function(val) {
                console.warn("Interception: Ignored attempt to override window.fetch with", val);
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.error("Failed to intercept window.fetch:", e);
        }
      })();
    </script>

    <div id="root"></div>

  </body>
